      // Show/hide the rows of a long list that are past its visible count
      function setupToggle(buttonId, rowClass, hiddenCount, label) {
        const button = document.getElementById(buttonId);
        if (!button || hiddenCount <= 0) return;
        const collapsedText = `Show all ${label} (${hiddenCount} more) ▾`;
        button.style.display = '';
        button.textContent = collapsedText;
        button.addEventListener('click', () => {
          const expanding = button.dataset.expanded !== 'true';
          document.querySelectorAll('.' + rowClass).forEach(row => row.style.display = expanding ? '' : 'none');
          button.dataset.expanded = expanding;
          button.textContent = expanding ? 'Show less ▴' : collapsedText;
        });
      }
